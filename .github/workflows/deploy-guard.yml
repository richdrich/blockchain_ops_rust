name: deploy-guard

# Guard on the deployment pull request (PR): only commits already merged to
# `master` may reach the `deployed` branch. Combined with branch protection on
# `deployed` that requires the `quality`, `unit`, and `integration` checks, this
# enforces "only vetted master commits deploy, and only when all gates are green".
on:
  pull_request:
    branches: [deployed]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  only-master:
    name: only-master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ensure the PR adds only master-vetted commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master deployed
          # Every non-merge commit this PR would add on top of `deployed` must
          # already be on `master`. Listing commits reachable from the head but
          # not from master and not from deployed leaves only unvetted work.
          #
          # This deliberately tolerates a "Update branch" merge of `deployed`
          # into the head (GitHub offers it because `deployed` accrues merge
          # commits and drifts from master): that merge's commits are all from
          # master or already on deployed, so the set stays empty — while any
          # commit that never went through master still trips the guard.
          extra=$(git rev-list --no-merges "${HEAD_SHA}" ^origin/master ^origin/deployed)
          if [ -z "${extra}" ]; then
            echo "all deployed commits are vetted through master — ok to deploy"
          else
            echo "::error::PR would deploy commits that are not on master:"
            echo "${extra}"
            exit 1
          fi
