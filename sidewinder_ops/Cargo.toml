[package]
name = "sidewinder_ops"
version = "0.6.3"
edition = "2024"
description = "Client for a Sidewinder sidechain node, built on the algo_ops parent-chain handle."
license = "MIT OR Apache-2.0"
repository = "https://github.com/richdrich/blockchain_ops_rust"
homepage = "https://github.com/richdrich/blockchain_ops_rust"
documentation = "https://docs.rs/sidewinder_ops"
readme = "README.md"
keywords = ["sidewinder", "sidechain", "algorand", "blockchain", "web3"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
# Test targets are declared explicitly below (per project guidelines: every test
# is referenced in Cargo.toml), so disable auto-discovery of `tests/*.rs`.
autotests = false

[dependencies]
# `version` is required to publish to crates.io: the path is used in-workspace,
# the version when resolving the published crate. Kept in lockstep with the
# other workspace crates (all bumped together by `cargo set-version`).
algo_ops = { path = "../algo_ops", version = "0.6.3" }
anyhow = "1"
base64 = "0.22"
# Async HTTP client; driven synchronously through a per-call Tokio runtime (see
# `rt_block_on`), mirroring the algo_ops pattern. rustls avoids an OpenSSL build
# dependency and matches the TLS backend already resolved in the workspace.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1"

[dev-dependencies]
# Simple test-writer logging.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true

# ── Test targets ─────────────────────────────────────────────────────────────
# One bucket for now: `unit` needs no external services — it drives the client
# against an in-process mock HTTP node (tests/support/mock_node.rs). The external
# multi-node integration test is issue #46 and lands as its own target.

[[test]]
name = "unit"
path = "tests/unit.rs"
