[package]
name = "algo_ops"
version = "0.1.0"
edition = "2024"
description = "Algorand implementation of the blockchain_ops traits, over algonaut."
license = "MIT OR Apache-2.0"
repository = "https://github.com/richdrich/blockchain_ops_rust"
publish = false
# Test targets are declared explicitly below (per project guidelines: every test
# is referenced in Cargo.toml), so disable auto-discovery of `tests/*.rs`.
autotests = false

[dependencies]
blockchain_ops = { path = "../blockchain_ops" }
algonaut = "0.8.0"
anyhow = "1"
base64 = "0.21"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Simple test-writer logging in the ported test-support helper.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true

# ── Test targets ─────────────────────────────────────────────────────────────
# Two buckets, after the bingle_rust pattern:
#   `unit`        — AlgoOps tests that need no running node; run by `cargo test`.
#   `integration` — localnet/dapp tests, all `#[ignore]`d; require algokit
#                   localnet. Run with `cargo test --test integration -- --ignored`.
# (Wiring CI to run the integration bucket is tracked separately.)

[[test]]
name = "unit"
path = "tests/unit.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
