[package]
name = "algo_ops"
version = "0.7.5"
edition = "2024"
description = "Algorand implementation of the blockchain_ops traits, over algonaut."
license = "MIT OR Apache-2.0"
repository = "https://github.com/richdrich/blockchain_ops_rust"
homepage = "https://github.com/richdrich/blockchain_ops_rust"
documentation = "https://docs.rs/algo_ops"
readme = "README.md"
keywords = ["algorand", "blockchain", "cryptocurrency", "algonaut", "web3"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
# Test targets are declared explicitly below (per project guidelines: every test
# is referenced in Cargo.toml), so disable auto-discovery of `tests/*.rs`.
autotests = false

[dependencies]
# `version` is required to publish to crates.io: the path is used in-workspace,
# the version when resolving the published crate. Kept in lockstep with
# blockchain_ops's version (both bumped together by `cargo set-version`).
blockchain_ops = { path = "../blockchain_ops", version = "0.7.5" }
algonaut = "0.8.0"
anyhow = "1"
base64 = "0.21"
# a direct HTTP GET for the block-header seed (see `block_seed`), so a state-proof transaction in a
# block body cannot fail the fetch through algonaut's full-block decode (issue #66). Already in the tree
# via algonaut, so no new version is pulled in.
reqwest = "0.13"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# Only pulled in when `test-support` is enabled; flips gated helpers to `pub`.
visibility = { version = "0.1", optional = true }

[features]
# Opt-in feature that re-exports genuinely test-only helpers (JSON parsers, the
# retry predicate, and the `build_call_app_tx*` escape hatches) as `pub`. They
# stay `pub(crate)` for the production build. Consumers enable this only for
# their test build.
test-support = ["dep:visibility"]

[dev-dependencies]
# Simple test-writer logging in the ported test-support helper.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The sign_bytes unit test verifies the raw signature against the public key.
ed25519-dalek = { version = "2", features = ["rand_core"] }
# The submit/confirm integration test acts as a consumer that builds and signs
# its own transaction with its own SDK, then submits the raw bytes via algo_ops.
algonaut = "0.8.0"
# Self dev-dependency so this crate's own `tests/` (separate crates that see only
# the public API) build with `test-support` on — keeping a bare `cargo test`
# working without extra flags.
algo_ops = { path = ".", features = ["test-support"] }

[lints]
workspace = true

# ── Test targets ─────────────────────────────────────────────────────────────
# Two buckets, after the bingle_rust pattern:
#   `unit`        — AlgoOps tests that need no running node. Run by a bare
#                   `cargo test` (and `cargo test --test unit`).
#   `integration` — localnet/dapp tests that require algokit localnet. Marked
#                   `test = false` so a bare `cargo test` skips them; run them
#                   explicitly with `cargo test --test integration`.
# CI runs the integration bucket against localnet via
# `.github/workflows/integration.yml`.

[[test]]
name = "unit"
path = "tests/unit.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
# Excluded from the default `cargo test`; opt in with `cargo test --test integration`.
test = false
