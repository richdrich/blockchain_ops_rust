# release-plz configuration.
#
# release-plz is used here ONLY to open the version-bump PR on `master` (the
# `release-pr` command in .github/workflows/deploy.yml). The actual crates.io
# publish and git tag happen in the deploy job, from the `deployed` branch — so
# release-plz's own `release` command is never invoked in continuous integration.
#
# `version_group` keeps both crates on a single, shared version: when either
# changes, release-plz assigns them the same (highest) next version, so the two
# crates never drift apart.

[[package]]
name = "blockchain_ops"
version_group = "blockchain_ops_rust"

[[package]]
name = "algo_ops"
version_group = "blockchain_ops_rust"
